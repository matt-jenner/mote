name: release-flatpak

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          app_version="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')"
          expected_tag="v${app_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match application version $app_version" >&2
            exit 1
          fi

      - run: npm ci

      - name: Validate Flatpak packaging
        run: npm run test:flatpak

      - name: Install Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49 \
            org.freedesktop.Sdk.Extension.node24//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build Flatpak
        run: npm run flatpak -- package

      - name: Upload Flatpak to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/flatpak/*.flatpak
