name: release-flatpak

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatpak-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          app_version="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')"
          expected_tag="v${app_version}"
          if [[ "$EVENT_NAME" == "release" && "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match application version $app_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$app_version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Validate Flatpak packaging
        run: npm run test:flatpak

      - name: Install Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49 \
            org.freedesktop.Sdk.Extension.node24//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build and inspect HEIC-disabled Flatpak
        run: MOTE_FLATPAK_BUNDLE_DIR="$RUNNER_TEMP/no-heic-flatpak" npm run flatpak -- package --no-heic

      - name: Build Flatpak
        run: npm run flatpak -- package

      - name: Upload Flatpak to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/flatpak/*.flatpak

      - name: Upload manual-check artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Mote-${{ steps.release.outputs.version }}-x86_64.flatpak
          path: dist/flatpak/*.flatpak
          if-no-files-found: error
          retention-days: 1
