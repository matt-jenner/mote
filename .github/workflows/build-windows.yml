name: windows-release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          $appVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$appVersion"
          if ($env:EVENT_NAME -eq 'release' -and $env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag $env:RELEASE_TAG does not match app version $expectedTag."
          }
          "version=$appVersion" | Add-Content $env:GITHUB_OUTPUT
          "installer_name=Mote-$appVersion-windows-x64-setup.exe" | Add-Content $env:GITHUB_OUTPUT
          "installer_path=dist/windows/Mote-$appVersion-windows-x64-setup.exe" | Add-Content $env:GITHUB_OUTPUT
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Build unsigned HEIC-enabled x64 installer
        run: npm run desktop:build:windows -- --ci
      - name: Upload installer to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INSTALLER_PATH: ${{ steps.release.outputs.installer_path }}
        shell: pwsh
        run: gh release upload "$env:RELEASE_TAG" "$env:INSTALLER_PATH"
      - name: Upload manual-check artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.installer_name }}
          path: ${{ steps.release.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 1
