name: ci

on: [push, pull_request]

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - if: runner.os != 'Windows'
        run: cargo test --workspace --all-features
      - if: runner.os == 'Windows'
        run: cargo test -p photo-cache --all-features -- --test-threads=1
      - if: runner.os == 'Windows'
        run: cargo test --workspace --all-features -- --test-threads=1
      - run: cargo test -p catalog-bench --test benchmark_smoke

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps webkit
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:browser
      - run: npm run --workspace @photo-viewer/interface build

  hosted-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:deployment
        env:
          CONTAINER_ENGINE: docker
      - run: ./scripts/hosted-smoke.sh
        env:
          CONTAINER_ENGINE: docker

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run --workspace @photo-viewer/interface build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: npm run desktop:build -- --bundles app
