name: ci

on: [push, pull_request]

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - name: Build pinned native decoders on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          platform=linux
          if [ "$RUNNER_OS" = macOS ]; then platform=macos; fi
          native_environment=$(packaging/heic/build-unix.sh --platform "$platform" --arch "$(uname -m)")
          eval "$native_environment"
          printf 'MOTE_HEIC_PREFIX=%s\nPKG_CONFIG_PATH=%s\n' "$MOTE_HEIC_PREFIX" "$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          if [ "$platform" = macos ]; then
            printf 'DYLD_LIBRARY_PATH=%s\n' "$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
          else
            printf 'LD_LIBRARY_PATH=%s\n' "$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          fi
      - name: Build pinned native DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/heic/build-windows.ps1 -Arch x64
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - if: runner.os != 'Windows'
        run: cargo test --workspace --all-features
      - if: runner.os == 'Windows'
        run: |
          cargo test --workspace --all-features --exclude photo-server -- --test-threads=1
          cargo test -p photo-server --all-features --lib -- --test-threads=1
      - run: cargo test -p photo-codec --test heif_backend
      - run: cargo build -p photo-server --locked
      - if: runner.os != 'Windows'
        shell: bash
        run: packaging/heic/verify-native-deps.sh --prefix "$MOTE_HEIC_PREFIX" --binary target/debug/photo-server
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/heic/verify-native-deps.ps1 -Prefix $env:MOTE_HEIC_PREFIX -Binary target/debug/photo-server.exe
      - run: cargo test -p catalog-bench --test benchmark_smoke
      - name: Packaging contracts
        if: runner.os != 'Windows'
        run: node --test tests/packaging/heic-native-build.test.mjs
      - name: Windows packaging and cleanup contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: node --test --test-name-pattern=Windows tests/packaging/heic-native-build.test.mjs

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run test:build
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:flatpak
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:browser
      - run: npm run --workspace @photo-viewer/interface build

  macos-launch-verification:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - run: node --test tests/build/macos-launch-verification.test.mjs

  hosted-container:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:deployment
        env:
          CONTAINER_ENGINE: docker
      - run: ./scripts/hosted-smoke.sh
        env:
          CONTAINER_ENGINE: docker
