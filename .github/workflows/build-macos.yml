name: macos-release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  macos-release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          app_version="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')"
          expected_tag="v${app_version}"
          if [[ "$EVENT_NAME" == "release" && "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match app version $expected_tag." >&2
            exit 1
          fi
          printf 'version=%s\n' "$app_version" >> "$GITHUB_OUTPUT"
          printf 'dmg_name=Mote-%s-macOS.dmg\n' "$app_version" >> "$GITHUB_OUTPUT"
          printf 'dmg_path=dist/macos/Mote-%s-macOS.dmg\n' "$app_version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci
      - name: Build pinned universal native decoders
        run: |
          native_environment="$(packaging/heic/build-unix.sh --platform macos --arch universal)"
          eval "$native_environment"
          printf 'MOTE_HEIC_PREFIX=%s\nPKG_CONFIG_PATH=%s\nDYLD_LIBRARY_PATH=%s\n' "$MOTE_HEIC_PREFIX" "$PKG_CONFIG_PATH" "$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Build ad-hoc-signed universal macOS app
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run desktop:build:universal -- --ci
      - name: Verify bundled native dependencies
        run: packaging/heic/verify-native-deps.sh --app dist/macos/Mote.app --arch universal
      - name: Create and verify DMG
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          app="dist/macos/Mote.app"
          dmg="dist/macos/Mote-${APP_VERSION}-macOS.dmg"
          stage="$(mktemp -d "$RUNNER_TEMP/mote-dmg.XXXXXX")"
          mountpoint="$(mktemp -d "$RUNNER_TEMP/mote-mounted.XXXXXX")"
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$mountpoint" >/dev/null || true
            fi
            rm -rf "$stage" "$mountpoint"
          }
          trap cleanup EXIT

          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Signature=adhoc'

          ditto "$app" "$stage/Mote.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Mote -srcfolder "$stage" -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint"
          mounted=true

          mounted_app="$mountpoint/Mote.app"
          mounted_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$mounted_app/Contents/Info.plist")"
          lipo "$mounted_app/Contents/MacOS/$mounted_executable" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$mounted_app"
          hdiutil detach "$mountpoint"
          mounted=false
      - name: Upload DMG to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DMG_PATH: ${{ steps.release.outputs.dmg_path }}
        run: gh release upload "$RELEASE_TAG" "$DMG_PATH"
      - name: Upload manual-check artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.dmg_name }}
          path: ${{ steps.release.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 1
