name: macos-app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-app:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci
      - run: npm run --workspace @photo-viewer/interface build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Build universal macOS app
        run: npm run desktop:build:universal -- --ci
      - name: Verify and archive app
        run: |
          app="dist/macos/Mote.app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/macos/Mote-universal-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Mote-universal-macos
          path: dist/macos/Mote-universal-macos.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
