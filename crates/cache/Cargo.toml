[package]
name = "photo-cache"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["heic"]
heic = ["photo-catalog/heic", "photo-codec/heic", "photo-domain/heic", "photo-metadata/heic"]

[dependencies]
photo-catalog = { path = "../catalog", default-features = false }
photo-codec = { path = "../codec", default-features = false }
photo-domain = { path = "../domain", default-features = false }
photo-metadata = { path = "../metadata", default-features = false }
blake3.workspace = true
fs2.workspace = true
libc = "0.2.189"
image.workspace = true
thiserror.workspace = true
uuid.workspace = true
walkdir.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
image.workspace = true
