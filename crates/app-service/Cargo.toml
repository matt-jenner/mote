[package]
name = "photo-app-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["heic"]
heic = ["photo-cache/heic", "photo-catalog/heic", "photo-codec/heic", "photo-core/heic", "photo-domain/heic", "photo-indexer/heic", "photo-metadata/heic"]
server-internal-prevalidated-source = ["photo-core/server-internal-prevalidated-source"]

[dependencies]
photo-cache = { path = "../cache", default-features = false }
photo-catalog = { path = "../catalog", default-features = false }
photo-codec = { path = "../codec", default-features = false }
photo-core = { path = "../core", default-features = false }
photo-domain = { path = "../domain", default-features = false }
photo-indexer = { path = "../indexer", default-features = false }
photo-metadata = { path = "../metadata", default-features = false }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "redox"))'.dependencies]
rustix.workspace = true

[dev-dependencies]
rusqlite.workspace = true
blake3.workspace = true
tempfile.workspace = true
image.workspace = true
chrono.workspace = true
tracing-subscriber.workspace = true
sha2 = "0.10.9"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
