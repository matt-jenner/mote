[package]
name = "photo-indexer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["heic"]
heic = ["photo-catalog/heic", "photo-core/heic", "photo-domain/heic", "photo-metadata/heic"]

[dependencies]
photo-domain = { path = "../domain", default-features = false }
photo-catalog = { path = "../catalog", default-features = false }
photo-core = { path = "../core", default-features = false }
photo-metadata = { path = "../metadata", default-features = false }
chrono.workspace = true
notify.workspace = true
tokio.workspace = true
tracing.workspace = true
walkdir.workspace = true
thiserror.workspace = true

[dev-dependencies]
image.workspace = true
tempfile.workspace = true
