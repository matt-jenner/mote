[package]
name = "photo-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["mote-defaults", "heic"]
mote-defaults = []
heic = ["photo-app-service/heic"]

[dependencies]
photo-cache = { path = "../cache", default-features = false }
photo-catalog = { path = "../catalog", default-features = false }
photo-domain = { path = "../domain", default-features = false }
photo-core = { path = "../core", default-features = false }
photo-app-service = { path = "../app-service", default-features = false, features = ["server-internal-prevalidated-source"] }
axum.workspace = true
futures-util.workspace = true
libc = "0.2.189"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
