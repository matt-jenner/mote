services:
  photo-viewer:
    image: localhost/photo-viewer:dev
    build:
      context: ..
      dockerfile: Containerfile
      args:
        MOTE_HEIC: "${MOTE_HEIC:-enabled}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PHOTO_VIEWER_DATA_DIR: /var/lib/photo-viewer
      PHOTO_VIEWER_CACHE_DIR: /var/cache/photo-viewer
      PHOTO_VIEWER_SOURCE_ROOT: /photos
      PHOTO_VIEWER_BIND: 0.0.0.0:8080
      MOTE_ACCENT_COLOR: "${MOTE_ACCENT_COLOR:-}"
    volumes:
      - "${PHOTO_PATH:-/srv/photos}:/photos:ro,Z"
      - "${PHOTO_VIEWER_DATA_PATH:?PHOTO_VIEWER_DATA_PATH must name a host directory}:/var/lib/photo-viewer:Z"
      - "${PHOTO_VIEWER_CACHE_PATH:?PHOTO_VIEWER_CACHE_PATH must name a host directory}:/var/cache/photo-viewer:Z"
