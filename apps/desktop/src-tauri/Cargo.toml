[package]
name = "photo-viewer-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace]

[profile.dev.package."*"]
opt-level = 3

[lib]
name = "photo_viewer_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["mote-defaults", "heic"]
mote-defaults = []
heic = ["photo-app-service/heic"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
photo-app-service = { path = "../../../crates/app-service", default-features = false }
photo-core = { path = "../../../crates/core", default-features = false }
photo-domain = { path = "../../../crates/domain", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
photo-catalog = { path = "../../../crates/catalog", default-features = false }
tempfile = "3.27.0"
uuid = "1.24.1"
