[workspace]
members = ["crates/*"]
exclude = ["apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
axum = "0.8.9"
blake3 = "1.8.7"
fs2 = "0.4.3"
chrono = { version = "0.4.45", features = ["serde"] }
globset = "0.4.20"
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
imagesize = "0.15.0"
kamadak-exif = "0.6.1"
notify = "8.2.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
rusqlite = { version = "0.40.2", features = ["bundled-full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.1", features = ["serde", "v4", "v5"] }
walkdir = "2.5.0"
